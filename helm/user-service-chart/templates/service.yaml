apiVersion: v1
kind: Service
metadata:
  name: dev-{{ .Release.Name }}-svc
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}
